meters:
- name: plan_subscription
  description: Flat monthly plan fee (Basic / Growth / Enterprise) including a block of MAU.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: monthly_active_users
  description: Unique users who loaded a chat in the billing month; included up to the plan block.
  unit: users
  aggregation: max
  dimensions:
  - account
  - plan
- name: mau_overage
  description: Monthly active users above the plan's included block, billed per additional MAU.
  unit: users
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track MAU against the plan's included block; watch overage accrual as active users grow.
- name: Allocation
  description: Attribute MAU to product surfaces or tenants where chat is embedded to map cost to teams.
- name: Optimization
  description: Right-size the plan so the flat block matches steady-state MAU; avoid loading the chat UI for users who will not engage.
- name: Accountability
  description: Review monthly MAU and overage against budget; reassess plan tier as the user base scales.
