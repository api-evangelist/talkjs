description: >-
  FinOps view of TalkJS spend. TalkJS bills a flat monthly subscription fee per
  plan (Basic, Growth, Enterprise) that includes a block of monthly active
  users (MAU), plus a per-MAU overage charge above the included block. Cost is
  driven primarily by MAU - the count of unique users who load a chat in a
  month - so spend scales with active user growth rather than message or API
  call volume.
notes: >-
  Plan fees and per-MAU overage rates are subject to change; verify against the
  TalkJS pricing page during reconciliation.
